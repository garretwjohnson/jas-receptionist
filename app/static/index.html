<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JAS Receptionist — Live Demo</title>
<style>
  :root {
    --bg: #0e1116; --panel: #171c24; --edge: #232b37; --ink: #e8ecf2;
    --dim: #8b96a5; --accent: #34c98e; --accent-dark: #1f8f63; --red: #e5484d;
    --caller: #2b3648; --ivy: #1d2f28;
  }
  * { margin: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink); min-height: 100vh;
    font: 15px/1.5 -apple-system, "SF Pro Text", Segoe UI, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .phone {
    width: 420px; max-width: 100%; background: var(--panel);
    border: 1px solid var(--edge); border-radius: 28px; overflow: hidden;
    display: flex; flex-direction: column; height: min(760px, 92vh);
    box-shadow: 0 24px 70px rgba(0,0,0,.5);
  }
  header { padding: 18px 22px 14px; border-bottom: 1px solid var(--edge); }
  .brand { font-size: 11px; letter-spacing: .14em; color: var(--dim); text-transform: uppercase; }
  h1 { font-size: 19px; font-weight: 650; margin-top: 2px; }
  .status { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 13px; color: var(--dim); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
  .live .dot { background: var(--accent); animation: pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  #log { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 84%; padding: 10px 14px; border-radius: 16px; font-size: 14.5px; }
  .msg.caller { align-self: flex-end; background: var(--caller); border-bottom-right-radius: 4px; }
  .msg.ivy { align-self: flex-start; background: var(--ivy); border-bottom-left-radius: 4px; }
  .msg.sys { align-self: center; background: none; color: var(--dim); font-size: 12.5px; }
  .who { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); margin-bottom: 3px; }
  .controls { padding: 16px 20px 22px; border-top: 1px solid var(--edge); display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; gap: 10px; }
  button {
    border: 0; border-radius: 14px; padding: 14px; font: 600 15px inherit;
    cursor: pointer; transition: filter .15s;
  }
  button:hover { filter: brightness(1.12); }
  #callBtn { flex: 1; background: var(--accent-dark); color: #fff; }
  #callBtn.oncall { background: var(--red); }
  #micState { text-align: center; font-size: 12.5px; color: var(--dim); min-height: 18px; }
  .textrow { display: flex; gap: 8px; }
  input {
    flex: 1; background: var(--bg); border: 1px solid var(--edge); color: var(--ink);
    border-radius: 12px; padding: 11px 14px; font: 14px inherit;
  }
  input:focus { outline: 1px solid var(--accent-dark); }
  #sendBtn { background: var(--edge); color: var(--ink); padding: 11px 16px; }
  a.office { color: var(--dim); font-size: 12px; text-decoration: none; }
  a.office:hover { color: var(--accent); }
</style>
</head>
<body>
<div class="phone">
  <header>
    <div class="brand">Johnson AI Solutions · AI Receptionist</div>
    <h1 id="bizName">Loading…</h1>
    <div class="status" id="statusRow"><span class="dot"></span><span id="statusTxt">Ready — press Call</span>
      <span style="flex:1"></span><a class="office" href="/office" target="_blank">Office view →</a>
    </div>
  </header>
  <div id="log"></div>
  <div class="controls">
    <div id="micState"></div>
    <div class="textrow">
      <input id="callerNum" placeholder="Caller ID, e.g. 480-555-0142 (what Ivy remembers you by)" title="Caller ID — this is what the receptionist remembers you by">
    </div>
    <div class="row"><button id="callBtn">📞 Call the office</button></div>
    <div class="textrow">
      <input id="typed" placeholder="Or type what the caller says…">
      <button id="sendBtn">Send</button>
    </div>
  </div>
</div>

<script>
const log = document.getElementById('log');
const callBtn = document.getElementById('callBtn');
const statusRow = document.getElementById('statusRow');
const statusTxt = document.getElementById('statusTxt');
const micState = document.getElementById('micState');
const typed = document.getElementById('typed');

let history = [];      // {role, content} for the API
let onCall = false;
let rec = null, recActive = false;
let greeting = '';
let caller = '';       // caller-ID number for this call (per-caller memory key)
let callStarted = '';  // ISO local time the call began (links bookings to the summary)
const callerNum = document.getElementById('callerNum');
try { callerNum.value = localStorage.getItem('jas.caller') || ''; } catch {}
callerNum.addEventListener('change', () => { try { localStorage.setItem('jas.caller', callerNum.value); } catch {} });
function localIso(d) { const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; }

fetch('/api/greeting').then(r => r.json()).then(d => {
  document.getElementById('bizName').textContent = d.name;
  greeting = d.greeting;
});

function add(role, text) {
  const div = document.createElement('div');
  if (role === 'sys') { div.className = 'msg sys'; div.textContent = text; }
  else {
    div.className = 'msg ' + (role === 'user' ? 'caller' : 'ivy');
    div.innerHTML = `<div class="who">${role === 'user' ? 'Caller' : 'Ivy (AI)'}</div>` +
                    document.createElement('span').appendChild(document.createTextNode(text)).parentNode.innerHTML;
  }
  log.appendChild(div); log.scrollTop = log.scrollHeight;
}

function speak(text, then) {
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 1.04; u.pitch = 1.0;
  const pick = speechSynthesis.getVoices().find(v =>
    /Samantha|Google US English|Aria|Jenny/i.test(v.name));
  if (pick) u.voice = pick;
  u.onend = () => then && then();
  speechSynthesis.speak(u);
}

function listen() {
  if (!onCall) return;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { micState.textContent = 'No mic support in this browser — use the text box (Chrome has voice).'; return; }
  rec = new SR();
  rec.lang = 'en-US'; rec.interimResults = false; rec.maxAlternatives = 1;
  recActive = true;
  micState.textContent = '🎙 Listening…';
  rec.onresult = e => {
    const said = e.results[0][0].transcript.trim();
    if (said) turn(said);
  };
  rec.onend = () => { recActive = false; if (onCall && !speechSynthesis.speaking) setTimeout(() => !recActive && !speechSynthesis.speaking && onCall && listen(), 250); };
  rec.onerror = () => { recActive = false; micState.textContent = 'Mic idle — speak or type.'; };
  rec.start();
}

async function turn(said) {
  if (rec) try { rec.abort(); } catch {}
  micState.textContent = '';
  add('user', said);
  history.push({ role: 'user', content: said });
  statusTxt.textContent = 'Ivy is thinking…';
  const t0 = Date.now();
  const tick = setInterval(() => { micState.textContent = `💭 Thinking… ${Math.round((Date.now() - t0) / 1000)}s (runs on the Claude subscription — a few seconds per turn)`; }, 250);
  try {
    const r = await fetch('/api/turn', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ history, caller })
    });
    const d = await r.json();
    history.push({ role: 'assistant', content: d.reply });
    add('assistant', d.reply);
    (d.trace || []).forEach(t => {
      if (t.tool === 'book_appointment' && t.result.ok)
        add('sys', `✅ Booked in office calendar — ${t.result.confirmation}`);
      if (t.tool === 'take_message' && t.result.ok)
        add('sys', '📝 Message saved for office staff');
    });
    statusTxt.textContent = 'On call';
    clearInterval(tick); micState.textContent = `Ivy answered in ${((Date.now() - t0) / 1000).toFixed(1)}s`;
    speak(d.reply, () => onCall && listen());
  } catch (e) {
    clearInterval(tick); micState.textContent = '';
    add('sys', 'Connection error — is the server running?');
    statusTxt.textContent = 'Error';
  }
}

callBtn.onclick = () => {
  if (!onCall) {
    onCall = true; history = []; log.innerHTML = '';
    caller = callerNum.value.trim(); callStarted = localIso(new Date());
    callBtn.textContent = '⏹ End call'; callBtn.classList.add('oncall');
    statusRow.classList.add('live'); statusTxt.textContent = 'Ringing…';
    const started = fetch('/api/call/start', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ caller }) }).then(r => r.json()).catch(() => null);
    setTimeout(async () => {
      const st = await started;
      if (st && st.returning) add('sys', `☎️ Returning caller${st.caller_name ? ': ' + st.caller_name : ''} — Ivy has their history`);
      else if (caller) add('sys', '☎️ New caller — Ivy will remember this number');
      statusTxt.textContent = 'On call';
      history.push({ role: 'assistant', content: greeting });
      add('assistant', greeting);
      speak(greeting, () => listen());
    }, 700);
  } else {
    onCall = false;
    speechSynthesis.cancel(); if (rec) try { rec.abort(); } catch {}
    callBtn.textContent = '📞 Call the office'; callBtn.classList.remove('oncall');
    statusRow.classList.remove('live'); statusTxt.textContent = 'Call ended';
    micState.textContent = '';
    const transcript = history.map(h => (h.role === 'user' ? 'Caller: ' : 'Ivy: ') + h.content).join('\n');
    fetch('/api/call/end', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ transcript, outcome: 'demo call', caller, started: callStarted }) })
      .then(r => r.json()).then(d => {
        const s = d.summary;
        if (s) add('sys', `📋 Post-call notes (${s.extracted_by}): ${s.summary} Interest: ${s.interest}.` +
                        (caller ? ` Brief: /brief/${encodeURIComponent(s.phone)}` : ''));
      }).catch(() => {});
    add('sys', 'Call ended — transcript logged.');
  }
};

function sendTyped() {
  const v = typed.value.trim();
  if (!v) return;
  if (!onCall) { callBtn.click(); setTimeout(() => { typed.value = ''; turn(v); }, 900); return; }
  typed.value = ''; turn(v);
}
document.getElementById('sendBtn').onclick = sendTyped;
typed.addEventListener('keydown', e => { if (e.key === 'Enter') sendTyped(); });
speechSynthesis.getVoices(); // warm the voice list
</script>
</body>
</html>
